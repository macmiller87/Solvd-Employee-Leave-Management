name: Continuous integration

on:
  push:
    paths:
      - "**.js"
      - "**.json"
      - "**.yml"
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  container-job:
    runs-on: ubuntu-latest
    
    container: macmiller87/solvd-employee-leave-management
    services:
      postgres:
        image: postgres
        env:     
          POSTGRES_PASSWORD: postgres  
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.0

      - name: Install dependencies
        run: yarn install
    
      - name: Connect to PostgreSQL
        run: node ./src/database/service/postgService.js
        env:
         POSTGRES_HOST: postgres
         POSTGRES_PORT: 5432

      - name: Create Tables
        run: node run create:tables
        env:
         POSTGRES_HOST: postgres
         POSTGRES_PORT: 5432

      - name: Run Tests
      - run: npm run






