name: CI/CD Pipeline

on:
  push:
    paths:
      - "**.js"
      - "**.json"
      - "**.yml"
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  setup-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Start app
      run: docker-compose up
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.15.0
    - run: npm ci

    - name: Clean up
      run: docker-compose down --volumes
