name: Continuous integration

on:
  push:
    paths:
      - "**.js"
      - "**.json"
      - "**.yml"
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  docker-image:
    runs-on: ubuntu-latest
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.15.0

    - name: Install dependencies
      run: yarn install

    - name: Login Docker Hub
      uses: docker/login-action@v3
      with:
       username: ${{ secret.DOCKER_HUB_USER }}
       password: ${{ secret.DOCKER_HUB_PASSWORD }}

   -  name: Build Docker Image
      uses: docker/setup-buildx-action@v3
      with:
        context: .
        push: true
        tags: ${{ secret.DOCKER_HUB_USER }}/solvd-employee-leave-management:latest





