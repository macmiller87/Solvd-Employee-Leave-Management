name: Continuous integration

on:
  push:
    paths:
      - "**.js"
      - "**.json"
      - "**.yml"
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  container-job:
    runs-on: ubuntu-latest
    container: node:10.18-jessie
    
    services:
      postgres:
        image: postgres
        env:     
          POSTGRES_PASSWORD: postgres      
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.0

      - name: Install dependencies
        run: yarn install
    
      - name: Create Tables
        run: npm run create:tables:github:actions
        env:
          POSTGRES_USER_DOCKER: postgres      
          POSTGRES_PASSWORD_DOCKER: postgres  
          POSTGRES_DATABASE_DOCKER: postgres
          POSTGRES_HOST_DOCKER: database
          POSTGRES_PORT: 5432
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
          LOCALE: ${{ vars.LOCALE }}
      
      - name: Run Tests
        run: npm run test:github:actions
        env:
          POSTGRES_USER_DOCKER: postgres      
          POSTGRES_PASSWORD_DOCKER: postgres  
          POSTGRES_DATABASE_DOCKER: postgres
          POSTGRES_HOST_DOCKER: database
          POSTGRES_PORT: 5432
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
          LOCALE: ${{ vars.LOCALE }}







